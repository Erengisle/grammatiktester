<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevblad — designutforskning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#f5f1e8; font-family: 'Inter', sans-serif; color:#1a1a1a; }
  body {
    background:
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,0.04) 31px 32px),
      #f5f1e8;
  }
  /* Common spreadsheet "chrome" wrapper to make mockups read as Google Sheets */
  .sheet {
    background:#fff;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    font-family: 'Arial', sans-serif;
    color:#1f1f1f;
    overflow:hidden;
  }
  /* Sheets top bar / toolbar fake */
  .sheet-chrome {
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-bottom:1px solid #e0e0e0;
    background:#f8f9fa;
    font-size: 11px; color:#5f6368;
    flex-shrink:0;
  }
  .sheet-chrome .dot { width:10px; height:10px; border-radius:50%; background:#0f9d58; }
  .sheet-body { flex:1; overflow:auto; padding: 14px 18px 20px; }
  /* Cell helpers */
  table.gs {
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.gs td, table.gs th {
    padding: 4px 6px;
    text-align:center;
    vertical-align:middle;
    font-size: 11px;
    white-space:nowrap;
  }
  table.gs th.area { text-align:left; }
  /* Cell hover/edit feel */
  .empty { color:#bdbdbd; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="elevblad-views.jsx"></script>
<script type="text/babel" src="main.jsx"></script>
</body>
</html>
