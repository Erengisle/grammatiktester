<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grammatiktester — Före / Efter</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html,body{margin:0;height:100%;background:#f0eee9;overflow:hidden}
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="mockup/before-screens.jsx"></script>
  <script type="text/babel" src="mockup/after-screens.jsx"></script>

  <script type="text/babel">
    const FRAME_W = 320, FRAME_H = 660;

    function Frame({ children }) {
      return (
        <IOSDevice width={FRAME_W} height={FRAME_H}>
          {children}
        </IOSDevice>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="hem" title="Startskärmen" subtitle="Eleven kommer rakt in i testvalen — ingen inloggning, ingen rollvalsida">
            <DCArtboard id="hem-fore" label="Före — onödigt rollval (Elev / Lärare)" width={FRAME_W} height={FRAME_H}>
              <Frame><BeforeHome/></Frame>
            </DCArtboard>
            <DCArtboard id="hem-efter" label="Efter — direkt till testområdena" width={FRAME_W} height={FRAME_H}>
              <Frame><AfterHome/></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="quiz" title="Quiz-fråga" subtitle="Där eleven spenderar 90 % av tiden">
            <DCArtboard id="quiz-fore" label="Före — som idag" width={FRAME_W} height={FRAME_H}>
              <Frame><BeforeQuiz/></Frame>
            </DCArtboard>
            <DCArtboard id="quiz-efter" label="Efter — större träffytor, streak, amber-accent" width={FRAME_W} height={FRAME_H}>
              <Frame><AfterQuiz/></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="resultat" title="Resultat-skärmen" subtitle="Belöningsögonblicket — viktigt för tonåringar">
            <DCArtboard id="res-fore" label="Före — liten ring, generiskt budskap" width={FRAME_W} height={FRAME_H}>
              <Frame><BeforeResult/></Frame>
            </DCArtboard>
            <DCArtboard id="res-efter" label="Efter — stor animerad ring, tydligt nästa steg" width={FRAME_W} height={FRAME_H}>
              <Frame><AfterResult/></Frame>
            </DCArtboard>
          </DCSection>

          <DCSection id="dashboard" title="Mina resultat (gas/webbapp1.html)" subtitle="Sammanställningen som öppnas via länken — översikt över alla tester">
            <DCArtboard id="dash-fore" label="Före — Google-blå header, smal tabell" width={FRAME_W} height={FRAME_H}>
              <Frame><BeforeDashboard/></Frame>
            </DCArtboard>
            <DCArtboard id="dash-efter" label="Efter — kortlayout, grupperat per område, mini-staplar" width={FRAME_W} height={FRAME_H}>
              <Frame><AfterDashboard/></Frame>
            </DCArtboard>
          </DCSection>

          <DCPostIt top={40} left={40} rotate={-3} width={210}>
            Mobilen är primär — alla ändringar funkar både på liten skärm och desktop.
          </DCPostIt>

          <DCPostIt top={40} right={40} rotate={2} width={220}>
            Klicka på en artboard för att zooma in. Drag för att ändra ordning.
          </DCPostIt>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
