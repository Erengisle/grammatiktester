<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammatikresultat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 24px 16px;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 24px;
    }

    header h1 { font-size: 1.5rem; margin-bottom: 4px; }
    header p  { opacity: 0.85; font-size: 0.95rem; }

    .tom {
      background: white;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      color: #777;
      font-size: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    thead tr { background: #e8f0fe; }
    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #1a73e8;
    }

    td {
      padding: 14px 16px;
      border-top: 1px solid #f0f0f0;
      font-size: 0.95rem;
    }

    tr:hover td { background: #fafafa; }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      min-width: 56px;
      text-align: center;
    }

    .rod  { background: #FF9999; color: #7a0000; }
    .gul  { background: #FFEB99; color: #6b5500; }
    .gron { background: #99E699; color: #1a5c00; }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 <?= namn ?></h1>
    <p>Dina bästa resultat per test</p>
  </header>

  <? if (resultat.length === 0) { ?>
    <div class="tom">Inga resultat registrerade ännu.</div>
  <? } else { ?>
    <table>
      <thead>
        <tr>
          <th>Test</th>
          <th>Område</th>
          <th>Resultat</th>
          <th>Poäng</th>
          <th>Datum</th>
        </tr>
      </thead>
      <tbody>
        <? for (var i = 0; i < resultat.length; i++) {
          var r = resultat[i];
          var klass = r.procent < 50 ? "rod" : r.procent < 75 ? "gul" : "gron";
          var datum = r.datum ? new Date(r.datum).toLocaleDateString("sv-SE") : "–";
        ?>
        <tr>
          <td><?= r.testId ?></td>
          <td><?= r.omrade ?></td>
          <td><span class="badge <?= klass ?>"><?= r.procent ?>%</span></td>
          <td><?= r.ratt ?>/<?= r.totalt ?></td>
          <td><?= datum ?></td>
        </tr>
        <? } ?>
      </tbody>
    </table>
  <? } ?>

  <footer>Uppdateras automatiskt vid varje ny inlämning.</footer>

</body>
</html>
