<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammatikresultat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Spectral:wght@400;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #F7F4EE;
      --surface:    #FFFFFF;
      --ink:        #0F1B2D;
      --slate:      #556070;
      --mist:       #96A3B0;
      --fog:        #DDD8D0;
      --amber:      #D4880A;
      --amber-light:#FDF3E0;
      --amber-dark: #A3660A;
      --green:      #1A7A4A;
      --green-bg:   #E8F5EE;
      --yellow:     #A07800;
      --yellow-bg:  #FDF8D0;
      --red:        #B52020;
      --red-bg:     #FDEAEA;
      --radius:     12px;
      --shadow:     0 2px 8px rgba(15,27,45,0.08);
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: 24px 16px 48px;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-family: 'Spectral', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.875rem;
      color: var(--slate);
    }

    .divider {
      width: 40px;
      height: 3px;
      background: var(--amber);
      border-radius: 2px;
      margin: 10px 0 0;
    }

    .area-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .area-header {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--fog);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .area-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--slate);
    }

    .area-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
      flex-shrink: 0;
    }

    .test-row {
      padding: 12px 18px;
      border-bottom: 1px solid var(--fog);
      display: grid;
      grid-template-columns: 56px 1fr 52px 52px;
      align-items: center;
      gap: 10px;
    }

    .test-row:last-child { border-bottom: none; }

    .test-id {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--slate);
    }

    .bar-wrap {
      background: var(--fog);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .bar.gron  { background: var(--green); }
    .bar.gul   { background: var(--yellow); }
    .bar.rod   { background: var(--red); }

    .score {
      font-size: 0.8rem;
      color: var(--mist);
      text-align: right;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.gron { background: var(--green-bg);  color: var(--green); }
    .badge.gul  { background: var(--yellow-bg); color: var(--yellow); }
    .badge.rod  { background: var(--red-bg);    color: var(--red); }

    .tom {
      text-align: center;
      color: var(--mist);
      font-size: 0.95rem;
      padding: 48px 0;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--mist);
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <header>
    <h1><?= namn ?></h1>
    <p>Dina bästa resultat per test</p>
    <div class="divider"></div>
  </header>

  <?
    var grouped = {};
    var omraden = [];
    for (var i = 0; i < resultat.length; i++) {
      var r = resultat[i];
      if (!grouped[r.omrade]) { grouped[r.omrade] = []; omraden.push(r.omrade); }
      grouped[r.omrade].push(r);
    }
  ?>

  <? if (omraden.length === 0) { ?>
    <div class="tom">Inga resultat registrerade ännu.</div>
  <? } else { ?>
    <? for (var o = 0; o < omraden.length; o++) {
      var omrade = omraden[o];
      var tester = grouped[omrade];
    ?>
    <div class="area-card">
      <div class="area-header">
        <div class="area-dot"></div>
        <h2><?= omrade ?></h2>
      </div>
      <? for (var t = 0; t < tester.length; t++) {
        var r = tester[t];
        var klass = r.procent < 50 ? "rod" : r.procent < 75 ? "gul" : "gron";
      ?>
      <div class="test-row">
        <span class="test-id"><?= r.testId ?></span>
        <div class="bar-wrap">
          <div class="bar <?= klass ?>" style="width:<?= r.procent ?>%"></div>
        </div>
        <span class="score"><?= r.ratt ?>/<?= r.totalt ?></span>
        <span class="badge <?= klass ?>"><?= r.procent ?>%</span>
      </div>
      <? } ?>
    </div>
    <? } ?>
  <? } ?>

  <footer>Uppdateras automatiskt vid varje ny inlämning.</footer>

</body>
</html>
